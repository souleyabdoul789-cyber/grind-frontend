name: Build GRIND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    env:
      VITE_GRIND_URL: ${{ vars.VITE_GRIND_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

    steps:
      - name: Checkout GRIND
        uses: actions/checkout@v4

      - name: Prepare Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3

      # Le keystore debug est conservé entre les builds afin que le SHA-1 Google
      # Android reste stable. Cette clé sert uniquement aux APK de test.
      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: grind-android-debug-keystore-v1

      - name: Ensure stable debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=GRIND Android Debug,O=G-SOCIETY,C=NE" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Install Android SDK platform 36
        shell: bash
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build React production bundle
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor plugins and web bundle
        run: npx cap sync android

      - name: Configure Android permissions and GRIND launcher icon
        run: |
          python3 -m pip install --user pillow
          python3 scripts/configure_android.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Export Android OAuth SHA-1 fingerprint
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android > android-debug-sha1.txt
          grep -E "Alias name:|SHA1:|SHA-1:" android-debug-sha1.txt || true
          {
            echo "### GRIND Android debug APK"
            echo "Package Android : com.gsociety.grind"
            echo "Le SHA-1 du certificat debug est dans l'artifact android-debug-sha1.txt."
            echo "Pour Google OAuth Android, créer un client OAuth Android avec ce package et ce SHA-1."
            echo "Cette clé est réservée aux builds de test, pas à une publication Play Store."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and OAuth fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: GRIND-Android-Debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-debug-sha1.txt
          if-no-files-found: error
          retention-days: 14
