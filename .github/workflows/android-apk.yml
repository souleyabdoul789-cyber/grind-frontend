name: Build GRIND Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    env:
      VITE_GRIND_URL: ${{ vars.VITE_GRIND_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

    steps:
      - name: Checkout GRIND
        uses: actions/checkout@v4

      - name: Read GRIND application version
        id: app_version
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version package.json invalide : $VERSION" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MAJOR > 99 || MINOR > 99 || PATCH > 99 )); then
            echo "Chaque partie de la version doit être comprise entre 0 et 99." >&2
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "GRIND_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "GRIND_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Version source : $VERSION ($VERSION_CODE)"

      - name: Prepare Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      # Le keystore debug est conservé entre les builds afin que le SHA-1 Google
      # Android reste stable. Cette clé sert uniquement aux APK de test.
      - name: Restore Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: grind-android-debug-keystore-v1

      - name: Ensure stable debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=GRIND Android Debug,O=G-SOCIETY,C=NE" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Install Android SDK platform 36
        shell: bash
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build React production bundle
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Configure Firebase Android (optional until FCM is configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            python3 -m json.tool android/app/google-services.json >/dev/null
            echo "Firebase Android configuration installed."
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not configured. The APK can be built, but Android push registration will not work until Firebase is configured."
          fi

      - name: Sync Capacitor plugins and web bundle
        run: npx cap sync android

      - name: Configure Android permissions and GRIND launcher icon
        run: |
          python3 -m pip install --user pillow
          python3 scripts/configure_android.py
          python3 scripts/configure_android_splash.py
          python3 scripts/configure_android_version.py

      - name: Verify Android Gradle version
        shell: bash
        run: |
          grep -Eq "^[[:space:]]*versionCode[[:space:]]+$GRIND_VERSION_CODE[[:space:]]*$" android/app/build.gradle
          grep -Eq "^[[:space:]]*versionName[[:space:]]+\"$GRIND_VERSION\"[[:space:]]*$" android/app/build.gradle
          echo "Gradle confirme $GRIND_VERSION ($GRIND_VERSION_CODE)."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify version inside APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -f "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "versionCode='$GRIND_VERSION_CODE' versionName='$GRIND_VERSION'"
          echo "La version intégrée à l'APK correspond à package.json."

      - name: Export Android OAuth SHA-1 fingerprint
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android > android-debug-sha1.txt
          grep -E "Alias name:|SHA1:|SHA-1:" android-debug-sha1.txt || true
          {
            echo "### GRIND Android debug APK"
            echo "Package Android : com.gsociety.grind"
            echo "Version : $GRIND_VERSION (versionCode $GRIND_VERSION_CODE)"
            echo "La version a été lue dans package.json et vérifiée dans l'APK final."
            echo "Le SHA-1 du certificat debug est dans l'artifact android-debug-sha1.txt."
            echo "Pour Google OAuth Android, créer un client OAuth Android avec ce package et ce SHA-1."
            echo "Cette clé est réservée aux builds de test, pas à une publication Play Store."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and OAuth fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: GRIND-Android-Debug-${{ steps.app_version.outputs.name }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-debug-sha1.txt
          if-no-files-found: error
          retention-days: 14
